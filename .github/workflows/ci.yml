name: CI
# The PUBLIC repository's checks (written 2026-09-28 for the split; the private repository keeps its own).
# Every suite runs ONCE per pull request, and once on each push to main; a branch push alone runs nothing,
# because its pull request is where it is judged. The job is named "smoke" because the main-lock ruleset
# requires a check of that name, sourced from GitHub Actions.
permissions:
  contents: read        # nothing in CI may push
  pull-requests: read
on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    # A backstop, so a hung check is a red rather than a pull request stuck at "running" (#279).
    # Measured 2026-09-30: the whole job took 3 min 47 s on CI, and every step after the install took
    # 4 min 26 s and 4 min 38 s in two runs on a loaded four-core machine. Each engine run that
    # test/gauge.js and test/horno.js start stops itself at 3 min and says so, three of them at most,
    # so 20 min is above a normal job plus every one of those limits together: when one hangs, its
    # own sentence prints before this fires.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0   # the address check reads every commit a pull request brings
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      # The commits this run brings, worked out once for the two checks that read every one of them (the private list
      # and the addresses): on a pull request, its base branch to its head; on a push to main, what the push brings.
      # Nothing is checked here.
      - name: The commits this run brings
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            BASE="origin/$BASE_REF"; HEAD_SHA="$PR_HEAD"
          else
            BASE="$BEFORE"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"   # the first push: everything from the first commit
            fi
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          echo "RANGE_BASE=$BASE" >> "$GITHUB_ENV"
          echo "RANGE_HEAD=$HEAD_SHA" >> "$GITHUB_ENV"
      # The owner, 2026-09-28: new work here must carry nothing about his personal life. Every
      # file and file name is read against the private map's terms, handed in as an encrypted secret and
      # never printed, and so is every commit the run brings: its message, who made it, and each line it adds,
      # which stay in the history after a later commit takes them out. No secret (a fork's pull request gets none)
      # is a red: a session brings a fork's commits into a branch here, reviews them, and the check runs there. On
      # CI the check is a red without --range. First, before any other check.
      - name: Nothing personal from the private list is in this repository
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
          EVENT: ${{ github.event_name }}
        run: |
          # On a pull request this runs the BASE branch's copy of the check, never the branch's own: a
          # branch that weakens the check, or the clean copy it loads, is read by the check it would
          # replace. The copy sits in an untracked folder one level below the root, so it reads this
          # checkout's files (the branch's own copy of the check among them) and is not one of them.
          # A push to main runs main's own copy, which was itself checked this way before it merged.
          # This guards against an honest mistake, not a hostile branch: a branch here can still edit
          # this file, and only an approval before the secret is handed over closes that.
          # Either copy is handed the commits this run brings (--range, worked out above); a base whose
          # copy is older than --range ignores it and reads the files alone, until this reaches main.
          if [ "$EVENT" = "pull_request" ]; then
            if ! git rev-parse -q --verify 'HEAD^2' >/dev/null; then
              echo "FAIL: this pull request was not checked out as a merge onto its base, so the base's copy of the check cannot be found; nothing was checked"
              exit 1
            fi
            mkdir base-check.tmp
            git show 'HEAD^1:scripts/private-terms.js' > base-check.tmp/private-terms.js
            git show 'HEAD^1:scripts/clean-copy.js' > base-check.tmp/clean-copy.js
            s=0; node base-check.tmp/private-terms.js --range "$RANGE_BASE" "$RANGE_HEAD" || s=$?
            rm -rf base-check.tmp
            exit "$s"
          fi
          node scripts/private-terms.js --range "$RANGE_BASE" "$RANGE_HEAD"
      - name: No personal address in a commit or a file — only no-reply ones
        run: node test/authors.js "$RANGE_BASE" "$RANGE_HEAD"
      - name: Every third-party file matches its fingerprint
        run: node test/vendored.js
      - name: Nothing that looks like a password or an access key is committed (the same list the site scan reads)
        run: node test/keys.js
      # On every run that is not a push to main it also reads every commit the pull request brings, not
      # only its tip: a quote added in one commit and taken out in the next is red. It asks whether the run
      # is a push to main, not whether the event is named pull_request, so a trigger changed in on: is a
      # red rather than a run that reads none of the pull request: pull_request_target, whose default
      # checkout is the base's tip, and a push to any other branch, whose green run on a pull request's
      # head would stand for its check. The checkout is the merge, so its first parent is the base and its
      # second the branch.
      # The second parent must be the pull request's own head: a checkout of the head, when the head is
      # itself a merge (a branch updated from its base), also has a second parent, and the range would
      # read the base's commits instead. Any other second parent, or none, is a red, not a pass. A red
      # plain run ends the step with a sentence that says what to do.
      - name: No quote credited to the owner is committed (the check's own red cases first; on a pull request, every commit it brings)
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node test/quotes.js --selftest
          if ! node test/quotes.js; then
            echo "FAIL: the plain run above is red, so the commits a pull request brings were not read. For each line it names, say in plain words what was asked, keeping its date, in a commit on this branch; a line a person reads and finds is not his words goes on REVIEWED in test/quotes.js with its fingerprint (node test/quotes.js --list) and a reason. For each stale entry it names, take that entry off REVIEWED."
            exit 1
          fi
          if [ "$EVENT" != "push" ] || [ "$REF" != "refs/heads/main" ]; then
            SECOND="$(git rev-parse -q --verify 'HEAD^2' || true)"
            if [ -z "$PR_HEAD" ] || [ "$SECOND" != "$PR_HEAD" ]; then
              echo "FAIL: this pull request was not checked out as the merge of its head (${PR_HEAD:-not given}) onto its base: the checkout's second parent is ${SECOND:-missing}, so HEAD^1..HEAD^2 would read the wrong commits or none. Check out the merge (actions/checkout with no ref) and run again; nothing was checked, and that is a red, not a pass"
              exit 1
            fi
            node test/quotes.js --range 'HEAD^1..HEAD^2'
          fi
      - name: The guards' own red cases
        run: node test/authors.js --selftest && node test/protect.js --selftest && node test/keys.js --selftest && node test/pushguard.js --selftest && node scripts/clean-copy.js --selftest && node scripts/private-terms.js --selftest && node test/toolguard.js --selftest
      # #316: every literal part the games draw is built through the shape builder on this change's engine and
      # on the base's (each on its own three.js), and one byte of difference, or one setting of the material it
      # is drawn with, is a red. Plain node, so it runs before the browser install. Its self-test runs first,
      # because a gate that cannot go red protects nothing. Exactly these two lines and nothing else: which base
      # to compare with is decided inside test/prims.js (--ci), where its self-test plants every branch, and
      # test/prims.js reads this step and fails if it changes. Keep them in one step.
      - name: Every literal part the games draw still builds the same through the shape builder (and the shape gate's own red cases)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          node test/prims.js --selftest
          node test/prims.js --ci
      - name: Install Playwright + Chromium
        run: |
          npm install playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Headless smoke test
        run: node test/smoke.js
      - name: The engine, against the game
        run: node test/engine.smoke.js --index index.html
      - name: The gauge — a brand-new world still boots and meets the engine on the same terms
        run: node test/gauge.js
      - name: El Horno — its shell still builds from index.html
        run: node test/horno.js
      - name: R10 — what we would publish is only the public game
        run: bash scripts/build-site.sh /tmp/_site && node test/public.js /tmp/_site
      - name: Offline play works, under a page that runs only its own script files
        run: node test/offline.js
      - name: A change to what players cache moves the version with it
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node test/bump.js "origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node test/bump.js "$BEFORE" HEAD
          else
            echo "the first push has no earlier version to compare against"
          fi
