  body{background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',system-ui,sans-serif; line-height:1.55;}
  .wrap{max-width:560px; margin:0 auto; padding:22px 16px 60px;}

  .hearts{letter-spacing:2px;}
  .xpbar{height:6px; background:var(--chip); border-radius:3px; overflow:hidden; margin-bottom:14px;}
  .xpbar div{height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--gold)); border-radius:3px; transition:width .3s;}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; color:var(--accent); margin:0 0 12px;}
  .worldpanel{padding:12px;}
  .viewport{position:relative; border-radius:10px; overflow:hidden; background:#241F2E; touch-action:none;}
  #veil{position:absolute; inset:0; background:#0B0A12; opacity:0; transition:opacity .42s ease; pointer-events:none; z-index:5;}
  #veil.on{opacity:1;}
  /* THE DOORWAY (owner, 2026-09-17: "i think i want that option A"). A portal changed the world
     between one frame and the next and then FROZE INPUT FOR 450ms with nothing drawn in that
     window — an instant cut followed by standing still somewhere you did not walk to. The slot
     was always there; it was empty. This fills it, in every camera at once, because it is a DIV
     over the viewport and not something painted into a canvas: the 3D camera renders to its own
     WebGL surface and would otherwise have needed its own copy of the whole effect.
     It shuts in the direction you are travelling and opens the same way, so the movement is the
     thing that says what happened — up a flight, down a well, or through a door on the flat. */
  #door{position:absolute; inset:0; pointer-events:none; z-index:6; overflow:hidden;}
  #door .leaf{position:absolute; left:0; right:0; height:52%; background:#0B0A12; transform:translateY(-102%); transition:transform var(--doorT,.32s) cubic-bezier(.4,0,.2,1);}
  #door .leaf.b{top:auto; bottom:0; transform:translateY(102%);}
  #door .leaf.a{top:0;}
  #door.shut .leaf{transform:translateY(0);}
  /* Travelling UP: BOTH leaves sweep off the top, so the new place rises into view. The percentages
     are of each LEAF, not of the screen, and the two leaves do not need the same one — a leaf anchored
     to the far edge has to cross the whole viewport to leave by the near one. -102% clears the top for
     the leaf that starts there and only lifts the bottom one into the top half, which is a black band
     across the new place that never goes away. Caught by the guard on its first run, not by reading. */
  #door.open-up .leaf.a{transform:translateY(-102%);} #door.open-up .leaf.b{transform:translateY(-200%);}
  #door.open-down .leaf.a{transform:translateY(200%);} #door.open-down .leaf.b{transform:translateY(102%);}
  #door.open-flat .leaf.a{transform:translateY(-102%);} #door.open-flat .leaf.b{transform:translateY(102%);}
  @media (prefers-reduced-motion: reduce){
    /* no sweep for somebody who has asked for none: the leaves simply stop being there */
    #door .leaf{transition:opacity var(--doorT,.32s) linear; transform:translateY(0); opacity:0;}
    #door.shut .leaf{opacity:1;}
    #door.open-up .leaf, #door.open-down .leaf, #door.open-flat .leaf{opacity:0; transform:translateY(0);}
  }
  .settings .box{touch-action:pan-y;}
  .tlsearch{display:flex; gap:8px; margin-bottom:10px;}
  .tlsearch input{flex:1; box-sizing:border-box; font-family:'IBM Plex Mono',monospace; font-size:.8rem; padding:8px 10px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink);}

  .dpad{position:absolute; left:calc(10px + env(safe-area-inset-left)); bottom:calc(10px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(3,44px); gap:2px; opacity:.92; touch-action:none; user-select:none;}
  .dpad button{border:none; border-radius:9px; background:rgba(20,16,30,.55); color:#EDE9F5; font-size:1.05rem; cursor:pointer; backdrop-filter:blur(2px); touch-action:none;}
  .dpad button:active{background:rgba(122,63,224,.75);}
  .dpad .blank{visibility:hidden;}
  .joy{position:absolute; left:calc(12px + env(safe-area-inset-left)); bottom:calc(12px + env(safe-area-inset-bottom)); width:116px; height:116px; touch-action:none; user-select:none;}
  .joybase{position:absolute; inset:0; border-radius:50%; background:rgba(20,16,30,.4); border:2px solid rgba(237,233,245,.25); backdrop-filter:blur(2px);}
  .knob{position:absolute; left:50%; top:50%; width:48px; height:48px; border-radius:50%; background:rgba(122,63,224,.85); border:2px solid rgba(237,233,245,.5); transform:translate(-50%,-50%); transition:transform .08s;}
  /* SAFE AREA. A phone's rounded corners, notch and home indicator eat the edges of the screen,
     and everything anchored to an edge has to step inside them. env() is 0 on a device without
     insets, so this costs nothing anywhere else. */
  .gear{position:absolute; right:calc(10px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top)); width:38px; height:38px; border-radius:10px; border:none; background:rgba(20,16,30,.55); color:#EDE9F5; font-size:1.05rem; cursor:pointer; z-index:4;}
  .gear svg{display:block; width:20px; height:20px; margin:auto; pointer-events:none;}
  #careForm input{box-sizing:border-box; min-width:0; font-family:'IBM Plex Sans',sans-serif; font-size:.85rem; padding:8px 10px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink);}
  .palrow{display:flex; gap:6px; margin-bottom:6px;}
  .palrow button{min-height:28px; min-width:30px; border-radius:8px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; font-size:.8rem; padding:4px 8px;}
  .palrow .palname{flex:1; text-align:left; font-family:'IBM Plex Sans',sans-serif;}
  .palrow button[aria-pressed="true"]{border-color:var(--accent); background:var(--accent); color:var(--accent-ink);}
  .palrow button:disabled{opacity:.35;}
  .terow{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .terow span{flex:1; font-family:'IBM Plex Mono',monospace; font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
  .terow input[type=color]{width:52px; height:30px; border:1.5px solid var(--line); border-radius:8px; background:var(--bg); padding:2px; cursor:pointer;}
  .wdrow{display:flex; gap:8px; flex-wrap:wrap; margin:2px 0 12px;}
  .wdrow .sw{width:30px; height:30px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0; background:var(--chip); color:var(--muted); font-size:.75rem; line-height:1;}
  .wdrow .sw[aria-pressed="true"]{border-color:var(--accent); outline:2px solid var(--accent); outline-offset:1px;}
  #wdpv{display:block; margin:0 auto 12px; width:132px; image-rendering:pixelated; background:#241F2E; border-radius:10px;}
  /* the chip in the corner of the world sits over live scenery — pale stone, dark water, a

  #status{background:rgba(16,13,24,.72); color:#EDE9F5; text-shadow:0 1px 2px rgba(0,0,0,.55);}
  .fsbtn{right:calc(54px + env(safe-area-inset-right)) !important;}
  .mapbtn{right:calc(98px + env(safe-area-inset-right)) !important;}
  .vmap{display:flex; flex-direction:column; align-items:center; gap:2px; margin-bottom:14px; font-size:.78rem;}
  .vmap .vrow{display:flex; gap:6px; justify-content:center; width:100%;}

  .vmap .vm.here{border-color:var(--accent); background:var(--accent); color:var(--accent-ink); font-weight:600;}
  .vmap .vlink{color:var(--muted); line-height:1.1;}
  .vmap .vm small{display:block; color:inherit; opacity:.78; font-size:.65rem;}
  .viewport.fs{position:fixed; inset:0; z-index:50; border-radius:0; display:flex; align-items:center; justify-content:center;}
  .viewport.fs canvas{width:100%; height:100% !important; object-fit:contain;}
  body.noscroll{overflow:hidden;}
  .status{position:absolute; left:calc(10px + env(safe-area-inset-left)); top:calc(10px + env(safe-area-inset-top)); background:rgba(20,16,30,.55); color:#EDE9F5; font-family:'IBM Plex Mono',monospace; font-size:.74rem; padding:5px 10px; border-radius:999px; pointer-events:none; z-index:4; letter-spacing:1px;}
  .ticker div+div{margin-top:2px;}
  .ticker .prev{opacity:.55;}
  .ticker{position:absolute; left:10px; top:44px; max-width:58%; background:rgba(20,16,30,.55); color:#EDE9F5; font-family:'IBM Plex Mono',monospace; font-size:.68rem; line-height:1.35; padding:5px 9px; border-radius:10px; z-index:4; cursor:pointer;}
  .brushes{position:absolute; left:50%; transform:translateX(-50%); top:54px; display:flex; flex-wrap:wrap; justify-content:center; max-width:88%; gap:5px; z-index:4; background:rgba(20,16,30,.55); padding:5px 7px; border-radius:12px;}
  .brushes button{width:44px; height:48px; border-radius:8px; border:1.5px solid transparent; background:rgba(237,233,245,.12); font-size:.95rem; cursor:pointer; padding:2px 0 0; display:flex; flex-direction:column; align-items:center; gap:1px; color:#EDE9F5;}
  .brushes button .bl{font-size:.5rem; letter-spacing:.03em; opacity:.85;}
  .brushes button[aria-pressed="true"]{border-color:#E0B45C; background:rgba(224,180,92,.25);}
  /* the world's action buttons: a column that fills upward from the bottom corner (Rosa 3, 7).
     column-reverse puts the first in the markup nearest the thumb; wrap-reverse sends an
     overflowing column left, into the world, rather than up and out of it; the cap keeps the
     top of the stack clear of the 38px corner icons at top:10px. The container ignores taps so
     the world can still be walked through the gaps between buttons. */
  .acts{position:absolute; right:calc(10px + env(safe-area-inset-right)); bottom:calc(10px + env(safe-area-inset-bottom)); z-index:5;
    display:flex; flex-direction:column-reverse; flex-wrap:wrap-reverse;

  .talk{position:static; font-family:'Unbounded',sans-serif; font-size:.8rem; padding:12px 16px; border-radius:12px; border:none; background:var(--accent); color:var(--accent-ink); cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.35);}

  .avatar{flex:0 0 auto; width:44px; height:44px; border-radius:50%; background:var(--chip); display:flex; align-items:center; justify-content:center; font-size:1.4rem;}
  .bubble{background:var(--bubble); border:1px solid var(--bubble-line); border-radius:4px 14px 14px 14px; padding:10px 13px;}
  .bubble b{display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; color:var(--accent); margin-bottom:3px;}
  .bubble p{margin:0; font-size:.93rem;}
  /* the reframe line on a quest answered long after its district's Saturday: the
     neighbour is still interested, never still waiting on you */
  .bubble p.late{font-style:italic; color:var(--muted); font-size:.87rem; margin-bottom:6px;}
  .settings.reader{position:fixed; inset:0; z-index:60; display:flex; justify-content:center;
    align-items:flex-start; overflow:hidden;
    padding:14px 10px 28px; background:rgba(16,13,24,.88);}
  /* isolation:isolate makes the reader a stacking context, which is the STRUCTURAL half of the
     paper seam (ARCH-LOG A15, engine.js paperSkin): a pack may restyle what is inside this sheet,
     and nothing it writes may paint on top of the HUD, the chrome or the world. Re-rooting every
     selector stops a pack SELECTING anything outside; this stops a descendant it legitimately
     styles from raising itself out. `position:fixed` is stripped in the engine for the same
     reason — it escapes the containing block, which a stacking context alone would not stop. */
  .paper{position:relative; isolation:isolate; width:100%; max-width:640px; margin:0 auto; background:#F7F2E4; color:#2A2620;
    border-radius:3px; padding:30px 24px 20px; box-shadow:0 10px 34px rgba(0,0,0,.5);
    font-family:'IBM Plex Mono',monospace; font-size:.78rem; line-height:1.55;
    box-sizing:border-box; display:flex; flex-direction:column; max-height:100%;}
  /* the document's own scroll box. min-height:0 is what lets a flex child shrink far enough to
     scroll at all — without it the column just grows past the screen and takes the bar with it. */
  .paperscroll{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;}
  /* Rosa, finding 5. One long option in a dropdown made EVERY field in the request form 70px wider
     than the phone, and the sheet slid to x=-24 when a field took focus. A control may not be sized
     by its longest contents: the field wins, the text inside it gets an ellipsis. And the writing
     boxes were taking their height from the settings panel's rule rather than the form's — 220px
     each, which put the button that files the request two screens down. */
  /* min-width:0 on the items, not only minmax(0,1fr) on the track: a grid item's automatic minimum
     size is its CONTENT, so a label wrapping a 392px dropdown overflowed a track that was already
     told it could be narrow. Capping the track alone does nothing without this. */
  .paper .dform>*{min-width:0;}
  .paper .dfl{display:block; min-width:0;}
  .paper .dform select, .paper .dform input, .paper .dform textarea{width:100%;}
  .paper select, .paper input, .paper textarea{max-width:100%; box-sizing:border-box;}
  .paper select{text-overflow:ellipsis;}
  .paper textarea{min-height:64px; resize:vertical;}
  .paper .dform{max-width:100%;}
  .paper::before{content:""; position:absolute; inset:0; border-radius:3px; pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.10), inset 0 30px 40px -34px rgba(0,0,0,.18);}
  .staple{position:absolute; top:13px; left:20px; width:15px; height:4px; background:#9AA1A8;
    border-radius:1px; transform:rotate(-8deg); box-shadow:0 1px 0 rgba(0,0,0,.35), 20px 1px 0 -1px rgba(0,0,0,.10);}
  /* a document held out inside a conversation — the same sheet the reader opens, folded small.
     Same cream, same staple, so opening it reads as picking up the thing she is holding. */
  .handed{display:inline-flex; align-items:center; gap:8px; margin:11px 0 1px; padding:9px 13px;
    background:#F7F2E4; color:#2A2620; border:1px solid #C9BFA6; border-radius:2px; position:relative;
    font-family:'IBM Plex Mono',monospace; font-size:.72rem; line-height:1.35; text-align:left;
    cursor:pointer; box-shadow:0 2px 9px rgba(0,0,0,.32);}
  .handed::before{content:""; position:absolute; top:-2px; left:10px; width:13px; height:3px;
    background:#9AA1A8; border-radius:1px; transform:rotate(-8deg); box-shadow:0 1px 0 rgba(0,0,0,.30);}
  .handed:hover,.handed:focus-visible{background:#FFFAEC; box-shadow:0 3px 12px rgba(0,0,0,.38);}
  .paper h2{font-family:'Unbounded',sans-serif; font-size:.98rem; line-height:1.3; margin:6px 0 2px; color:#1E1A16;}
  .paper .dsub{font-style:italic; color:#6B6355; margin:0 0 14px; font-size:.72rem;}
  .paper .dtmpl{margin:0; font-size:.62rem; letter-spacing:.09em; text-transform:uppercase; color:#8A8170;}
  .paper .dh{font-family:'Unbounded',sans-serif; font-size:.76rem; margin:18px 0 6px; color:#1E1A16;
    border-bottom:1px solid #D8CFB8; padding-bottom:4px;}
  .paper .dp{margin:6px 0;}
  .paper .dnote{margin:10px 0; padding:8px 10px; background:#EFE7D2; border-left:3px solid #C2A15A; font-style:italic; color:#5A5245;}
  .paper .dblank{margin:7px 0; display:flex; gap:8px; align-items:baseline;}
  .paper .dblank .dline{flex:1; border-bottom:1px dashed #B7AD95; min-height:1em;}
  .paper .dkv{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:8px 0;}
  .paper .dkv b{color:#6B6355; font-weight:600;}
  .paper .dform{margin:10px 0; display:grid; grid-template-columns:minmax(0,1fr); gap:12px;}  /* minmax(0,1fr): a grid column defaults to `auto`, which is as wide as its widest child — that is how one long dropdown option made every field overflow the phone (Rosa 5) */
  .paper .dfl{display:grid; gap:3px; font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:#6B6355;}

  .paper .dfl textarea{min-height:64px; resize:vertical;}
  .paper .dchecks{display:flex; flex-wrap:wrap; gap:6px 12px; text-transform:none; letter-spacing:0; font-size:.85rem;}
  .paper .dfrow{display:flex; gap:8px; margin-top:4px;}
  /* the night look (READERLOOK="night"): the same paper in purple dark — a pack's choice, cream by default */
  .paper.night{background:#1C1A22; color:#E8E4DC;}
  .paper.night::before{display:none;}
  .paper.night h2,.paper.night .dh{color:#FFFFFF;}

  #toast.crit{color:#FF7B72; border-left:3px solid #FF5A4F;}

        <button id="undoBtn"><span>↩️</span><span class="bl"></span></button>
      </div>
      <!-- Rosa, findings 3 and 7. These eleven used to be placed by a ladder of fixed distances
           from the bottom of the world — 16, 72, 128, 184, 240 — laid out for a tall frame. The
           world is 427px tall on a laptop and 266px on a phone, so on a phone the fifth rung
           landed OUTSIDE the frame, clipped, on top of the corner icons and not fully pressable.
           Three buttons shared the 184 rung and two shared the 240; 🎲 and 🔁 shared one exactly,
           so the random-look button had never been pressable at all.
           Nothing is placed by hand now. They are a column that fills upward from the bottom
           corner, so however many happen to be showing they stack without touching, and the
           column is capped clear of the icons — past that it wraps into a second column rather
           than climbing out of the world. A `hidden` button takes no part in a flex layout, so
           the stack closes up on its own. -->
      <div class="acts" id="acts">
        <button class="talk" id="talk" hidden></button>
        <!-- a person who has a quest AND runs something (a document, a room, the fitting room,
             the chair) offers both: the quest on Talk, the service here. Hidden buttons take no part
             in this flex stack, so it costs nothing on the screens where nobody has both. -->
        <button class="talk" id="serve" hidden></button>
        <button class="talk treat" id="treat" hidden></button>
        <button class="talk treat" id="ball" hidden></button>
        <button class="talk treat" id="leash" hidden></button>
        <button class="talk read" id="read" hidden></button>
        <button class="talk treat" id="band" hidden></button>
        <button class="talk treat" id="aleRnd" hidden title="a random alebrije look">🎲</button>
        <button class="talk treat" id="aleNext" hidden title="the next alebrije look">🔁</button>
        <button class="talk treat" id="adopt" hidden></button>
        <button class="talk treat" id="love" hidden></button>
        <button class="talk treat" id="cmd" hidden></button>
      </div>
      <div class="toast" id="toast"></div>
      <div class="ticker" id="ticker" hidden></div>
      <div class="settings" id="settings" hidden>
        <div class="box">
          <h3 id="setTitle"></h3>
          <details class="drawer" id="drwCtl" open>
            <summary><span id="drwCtlLb"></span></summary>
            <label id="lbCtl"></label>
            <div class="optrow">
              <button id="optSwipe"></button>
              <button id="optJoy"></button>
              <button id="optPad"></button>
            </div>
          </details>

          <details class="drawer" id="drwLook">
            <summary><span id="drwLookLb"></span></summary>
            <label id="lbTheme"></label>
            <div class="optrow" id="themeRow">
              <button data-th="meridian"></button>
              <button data-th="forest"></button>
              <button data-th="fairy"></button>
              <button data-th="sunset"></button>
            </div>
            <div class="optrow" id="themeRow2">
              <button data-th="custom" id="thCustom" hidden></button>
              <button id="teOpen" hidden></button>
            </div>
            <label id="lbCam"></label>
            <div class="optrow" id="camRow">
              <button data-cam="top"></button>
              <button data-cam="front"></button>
              <button data-cam="iso"></button>
              <button data-cam="3d"></button>
            </div>
            <label id="lbSeason"></label>
            <div class="optrow" id="seasonRow"></div>
            <!-- how the camera turns: taste, so it is a setting rather than a constant. "Instant"
                 is exactly the behaviour before this row existed. -->
            <label id="lbEase" hidden></label>
            <div class="optrow" id="easeRow" hidden>
              <button data-ease="instant"></button><button data-ease="quick"></button>
              <button data-ease="easy"></button><button data-ease="slow"></button>
            </div>
          </details>

          <!-- #127: appearance is its own subject, so it gets its own drawer. These two rows used
               to hang off the bottom of the Picture drawer, under the season buttons — a drawer
               built for the theme, the camera and the season — and the dropdown they brought with
               them was the one control on the page that looked like nothing else. Each drawer is
               one subject; nothing is appended to a drawer it does not belong in. -->
          <details class="drawer" id="drwSelf">
            <summary><span id="drwSelfLb"></span></summary>
            <label id="lbAle" hidden></label>
            <div class="optrow" id="aleRow" hidden></div>
          </details>

          <details class="drawer" id="drwSound">
            <summary><span id="drwSoundLb"></span></summary>
            <label id="lbMusic"></label>
            <div class="optrow" id="tuneRow">
              <button data-tn="default"></button>
              <button data-tn="meridian"></button>
              <button data-tn="fairy"></button>
              <button data-tn="forest"></button>
              <button data-tn="sunset"></button>
            </div>
            <div class="optrow">
              <button id="musMute" style="flex:0 0 38%;"></button>
              <input type="range" id="musVol" min="0" max="100" step="1" aria-label="music volume">
            </div>
          </details>

          <details class="drawer" id="drwGame">
            <summary><span id="drwGameLb"></span></summary>
            <label id="lbLang"></label>
            <div class="optrow">
              <button id="optEn">English</button>
              <button id="optEs">Español</button>
            </div>
            <label id="lbStakes" hidden></label>
            <div class="optrow" id="stkRow" hidden>
              <button id="stkNone"></button>
              <button id="stkHearts"></button>
            </div>
            <label id="lbAdm"></label>
            <div class="optrow">
              <button id="admOff"></button>
              <button id="admOn"></button>
            </div>
          </details>

          <div class="optrow"><button id="openLab" style="flex:1;"></button></div>
          <div class="optrow"><button id="openExp" style="flex:1;"></button></div>
          <div class="optrow"><button id="openWd" style="flex:1;" hidden></button></div>
          <div class="optrow"><button id="openTp" style="flex:1;"></button></div>
          <div class="optrow"><button id="openMp" style="flex:1;"></button></div>
          <div class="optrow"><button id="replay" style="flex:1;"></button></div>
          <button class="close" id="closeSet"></button>
          <p id="verTag" style="text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:var(--muted);margin:10px 0 0;"></p>
        </div>
      </div>
      <div class="settings" id="npcMaker" hidden>
        <div class="box">
          <h3 id="nmTitle"></h3>
          <label id="nmLb"></label>
          <input type="text" id="nmName" maxlength="24" autocomplete="off">
          <div class="optrow">
            <button id="nmOk"></button>
            <button id="nmCancel"></button>
          </div>
          <div class="optrow">
            <button id="nmLook" hidden></button>
            <button id="nmOut" hidden></button>
          </div>
        </div>
      </div>
      <div class="settings" id="textlab" hidden>
        <div class="box">
          <h3 id="tlTitle"></h3>
          <label id="tlHint"></label>
          <div class="tlsearch"><input id="tlSearch" type="text"><button id="tlFind">🔍</button></div>
          <textarea id="tlArea" spellcheck="false"></textarea>
          <div class="optrow"><button id="tlApply"></button><button id="tlClose"></button></div>
        </div>
      </div>
      <div class="settings" id="exporter" hidden>
        <div class="box">
          <h3 id="exTitle"></h3>
          <div class="optrow"><button id="exTabJson"></button><button id="exTabRep"></button><button id="exTabCare" hidden></button><button id="exTabRoom" hidden></button></div>
          <label id="exHint"></label>
          <div id="careForm" hidden style="display:flex; gap:8px; margin-bottom:10px;">
            <input id="petName" type="text" maxlength="16" style="flex:2;">
            <input id="petAm" type="time" style="flex:1;">
            <input id="petPm" type="time" style="flex:1;">
          </div>
          <textarea id="exArea" readonly></textarea>
          <div class="optrow"><button id="exCopy"></button><button id="exDl" hidden></button><button id="exIcs" hidden></button><button id="exClose"></button></div>
        </div>
      </div>
      <div class="settings" id="travel" hidden>
        <div class="box">
          <h3 id="tvTitle" style="margin-top:0;"></h3>
          <p id="tvNote" style="font-size:.8rem; color:var(--muted); margin:4px 0 12px;"></p>
          <div id="tvList" style="display:flex; flex-direction:column; gap:8px; margin-bottom:12px;"></div>
          <button class="close" id="tvClose"></button>
        </div>
      </div>
      <div class="settings" id="mapov" hidden>
        <div class="box">
          <h3 id="mapTitle"></h3>
          <canvas id="mapcv" style="width:100%; border-radius:8px; image-rendering:pixelated;"></canvas>
          <p id="mapNote" style="font-size:.78rem; color:var(--muted); margin:8px 0 12px;"></p>
          <button class="close" id="mapClose"></button>
        </div>
      </div>
      <div class="settings" id="themeEd" hidden>
        <div class="box">
          <h3 id="teTitle"></h3>
          <label id="teFrom"></label>
          <div class="optrow" id="teClone">
            <button data-cl="meridian">🏢</button><button data-cl="forest">🌿</button><button data-cl="fairy">🧚</button><button data-cl="sunset">🌇</button>
          </div>
          <label id="teModeLb"></label>
          <div class="optrow"><button id="teLight">☀️</button><button id="teDark">🌙</button></div>
          <label id="tePalsLb"></label>
          <input type="text" id="teName" maxlength="18" autocomplete="off">
          <div id="tePals"></div>
          <div id="teRows"></div>
          <div class="optrow" style="margin-top:10px;"><button id="teFix"></button></div>
          <button class="close" id="teClose"></button>
        </div>
      </div>
      <div class="settings" id="mpanel" hidden>
        <div class="box">
          <h3 id="mpTitle"></h3>
          <p id="mpNote" style="font-size:.85rem; color:var(--muted); margin:4px 0 14px;"></p>
          <button class="close" id="mpClose"></button>
        </div>
      </div>
      <div class="settings" id="parkCard" hidden>
        <div class="box">
          <h3 id="pkTitle"></h3>
          <p id="pkSum" style="font-size:.95rem; margin:8px 0 6px;"></p>
          <p id="pkLove" style="font-size:.9rem; margin:0 0 10px;"></p>
          <p id="pkTeaser" style="font-size:.8rem; color:var(--muted); margin:0 0 14px;"></p>
          <button class="close" id="pkClose"></button>
        </div>
      </div>
      <div class="settings" id="adoptP" hidden>
        <div class="box">
          <h3 id="adoptTitle"></h3>
          <label id="lbBreed"></label>
          <div class="optrow" id="adoptBreeds">
            <button data-b="beagle"></button>
            <button data-b="lab"></button>
            <button data-b="chi"></button>
          </div>
          <label id="lbCoat"></label>
          <div class="optrow" id="adoptCoats" style="gap:10px;"></div>
          <input id="adoptName" maxlength="14" style="width:100%; box-sizing:border-box; font-size:1rem; padding:10px 12px; margin:8px 0 12px; border-radius:10px; border:1px solid var(--line); background:var(--bubble); color:var(--ink);">
          <div class="optrow"><button id="adoptGo" style="flex:1;"></button><button id="adoptX" style="flex:1;"></button></div>
        </div>
      </div>
      <div class="settings" id="dogP" hidden>
        <div class="box">
          <h3 id="dogPTitle"></h3>
          <div class="optrow"><button id="cmdSit" style="flex:1;"></button><button id="cmdDown" style="flex:1;"></button><button id="cmdStay" style="flex:1;"></button></div>
          <div class="optrow"><button id="cmdCome" style="flex:1;"></button><button id="cmdFollow" style="flex:1;"></button></div>
          <div class="optrow"><button id="cmdRen" style="flex:1;" hidden></button><button id="cmdReh" style="flex:1;" hidden></button></div>
          <button class="close" id="dogPX"></button>
        </div>
      </div>
      <div class="settings" id="renP" hidden>
        <div class="box">
          <h3 id="renTitle"></h3>
          <input id="renName" maxlength="14" style="width:100%; box-sizing:border-box; font-size:1rem; padding:10px 12px; margin:8px 0 12px; border-radius:10px; border:1px solid var(--line); background:var(--bubble); color:var(--ink);">
          <div class="optrow"><button id="renGo" style="flex:1;"></button><button id="renX" style="flex:1;"></button></div>
        </div>
      </div>
      <div class="settings" id="tpass" hidden>
        <div class="box">
          <h3 id="tpTitle"></h3>
          <p id="tpNote" style="font-size:.8rem; color:var(--muted); margin:4px 0 10px;"></p>
          <canvas id="tpqr" style="display:block; margin:0 auto 12px; width:190px; height:190px; image-rendering:pixelated; background:#FFF; border-radius:10px;"></canvas>
          <div class="optrow"><button id="tpShare"></button><button id="tpCopy"></button></div>
          <button class="close" id="tpClose"></button>
        </div>
      </div>
      <div class="settings" id="wardrobe" hidden>
        <div class="box">
          <h3 id="wdTitle"></h3>
          <p id="wdNote" style="font-size:.8rem; color:var(--muted); margin:4px 0 10px;"></p>
          <div class="optrow"><button id="wdTabF">🐕 Frederick</button><button id="wdTabC">🐈 Canela</button></div>
          <canvas id="wdpv" width="66" height="44"></canvas>
          <label id="wdLbBandana"></label><div class="wdrow" id="wdRowBandana"></div>
          <label id="wdLbCollar"></label><div class="wdrow" id="wdRowCollar"></div>
          <label id="wdLbCape"></label><div class="wdrow" id="wdRowCape"></div>
          <button class="close" id="wdClose"></button>
        </div>
      </div>
    </div>
    <p class="hint" id="ctlHint"></p>
  </div>

  <!-- The reader sits OUTSIDE #world on purpose. It used to live inside #vp, which is inside
       #world — and a quest hides #world, so a document a character handed you opened into a
       display:none subtree: correct state, correct button, nothing on screen. It is
       position:fixed and overlays everything, so it belongs at the top level where neither
       the street nor a conversation can collapse it. (Found 2026-09-04 by measuring the
       panel's box instead of trusting its .hidden flag.) -->
  <div class="settings reader" id="reader" hidden>
    <div class="paper" id="paperSheet">
      <div class="staple" aria-hidden="true"></div>
      <!-- Rosa's first finding, 2026-09-08. The bar used to be `position:sticky; bottom:0` at the
           foot of this paper, and a sticky bar hovers over WHATEVER content happens to be in that
           band — not only over the end of the document. On a phone, where the sheet is taller than
           the screen, it opened parked on top of the town's form buttons: the
           town's whole write surface, pressed straight through to Copy. Reserving space at the foot
           would not have helped, because the overlap moves with the scroll. So the paper is a column
           now: the document scrolls in its own box, and the bar sits under it in normal flow, where
           it cannot be on top of anything. -->
      <div class="paperscroll" id="paperScroll">
        <p class="dtmpl" id="docTmpl" hidden></p>
        <h2 id="docTitle"></h2>
        <p class="dsub" id="docSub"></p>
        <div id="docBody"></div>
      </div>
      <div class="optrow docbar">
        <button id="docCopy"></button><button id="docDl"></button><button id="docClose"></button>
      </div>
    </div>
  </div>
  <div class="panel" id="card" hidden>
    <p class="eyebrow" id="qtag"></p>
    <div class="npc"><div class="avatar" id="npcAv"></div><div class="bubble"><b id="npcName"></b><p id="npcLate" class="late" hidden></p><p id="npcSay"></p><button id="npcDoc" class="handed" hidden></button></div></div>
    <div class="codex"><b id="cdxLb"></b><p id="codex"></p></div>
    <p class="q" id="q"></p>
    <div class="choices" id="choices"></div>
    <!-- the room interview (content-declared INTERVIEW): these live INSIDE the card because the
         world panel — and every dialog in it — is hidden while a card is up -->
    <div class="rmask" id="rmAsk" hidden><b id="rmTitle"></b><label for="rmText" id="rmLb"></label><textarea id="rmText" maxlength="140" rows="2" autocomplete="off"></textarea><div class="rmbar"><button class="opt" id="rmOk"></button><button class="opt" id="rmCancel"></button></div></div>
    <p class="why" id="rmWhy" hidden></p>
    <button class="rmlater" id="rmLater" hidden></button>
    <div class="rmsheet" id="rmSheet" hidden></div>
    <div class="rmbar" id="rmBar" hidden><button class="opt" id="rmCopy"></button><button class="opt" id="rmAgain"></button><button class="opt" id="rmBack"></button></div>
    <div id="verdict" hidden></div>
    <div class="levelup" id="levelup" hidden></div>
    <button class="btn" id="next" hidden></button>
  </div>

  <div class="panel end" id="end" hidden>
    <h2 id="endTitle"></h2>
    <p class="final" id="endScore"></p>
    <p class="epi" id="epi"></p>
    <button class="btn" id="endGo" hidden></button>
  </div>
</div>
<script src="qr.js"></script>
<script src="content/meridian/strings.js"></script>
<script src="content/meridian/quests.en.js"></script>
<script src="content/meridian/quests.es.js"></script>
<script src="content/meridian/npcs.js"></script>
<script src="content/meridian/maps.js"></script>
<script src="content/meridian/art.js"></script>
<script src="content/meridian/config.js"></script>
<script src="content/meridian/room.js"></script>
<script src="content/meridian/docs.js"></script>
<!-- which engine files this world needs: see engine/boot.js. A pack that lists no "3d"
     in CAMERAS never downloads Three.js — a quarter of the game. -->
<script src="engine/boot.js"></script>
<!-- offline play: its own file, because this page runs no script written inside it (#254) -->
<script src="sw-register.js"></script>
</body>
